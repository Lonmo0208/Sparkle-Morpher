plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

apply from: rootProject.file('gradle/verify-native-abi.gradle')

version = mod_version
group = maven_group

apply from: rootProject.file('gradle/distribution.gradle')
def isCurseForgeDist = rootProject.ext.isCurseForgeDist

repositories {
    mavenLocal()
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.creeperhost.net' }
}

base {
    archivesName = "sparkle-morpher-${project.version}-neo1.21.1"
}

tasks.named("jar") {
    archiveFileName = rootProject.ext.distributionArchiveName("sparkle-morpher-${project.version}-neo1.21.1")
}

// Standalone server-only upload source set. Declared before the neoForge block
// because the mods{} mapping below references it.
sourceSets {
    exspm_hserverysm_model {
        java {
            srcDir 'exspm_hserverysm_model_shared/java'
            srcDir 'src/exspm_hserverysm_model/java'
        }
        resources {
            srcDir 'src/exspm_hserverysm_model/resources'
        }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "exspm_hserverysm_model" {
            sourceSet sourceSets.exspm_hserverysm_model
        }
    }

    // Provide the MC/NeoForge dependency chain to the standalone server-only
    // upload source set (it must not depend on the SPM main classes).
    addModdingDependenciesTo(sourceSets.exspm_hserverysm_model)
}

sourceSets.main.java {
    srcDir 'common/src/main/java'
    srcDir 'src/neoforge/java'
    srcDir 'exspm_hserverysm_model_shared/java'
    if (!isCurseForgeDist) {
        srcDir rootProject.ext.distributionNativeJavaSourceDir
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

if (isCurseForgeDist) {
    tasks.named('compileJava', JavaCompile) {
        source = files(
                fileTree('common/src/main/java'),
                fileTree('src/neoforge/java'),
                fileTree('src/curseforge/java'),
                fileTree('exspm_hserverysm_model_shared/java')
        )
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    // Optional at runtime. Used only to compile the TaCZ 1.21.1 compatibility bridge.
    compileOnly "maven.modrinth:OypNE65K:wPvGWIj9"
    // Optional at runtime. SlashBlade Resharped 重锋 (1.21.1 NeoForge).
    compileOnly files("libs/slashblade-resharped.jar")
    // WebP + AVIF ImageIO decoders (pure-Java SPI plugins, bundled via jarJar).
    // The local jar has Automatic-Module-Name: rip.ysm.imagestream so jarJar can embed it.
    implementation files("libs/ImageStream--SNAPSHOT.jar")
    jarJar files("libs/ImageStream--SNAPSHOT.jar")

    // R0: JVM 单测（JUnit 5），测试代码在 src/test/java。
    // moddev 将 MC 依赖链剥离出 test 运行时：neoforge + minecraft-dependencies（gson/joml/fastutil 等库）
    // + moddev 生成的 MC 类 jar（接口签名引用 MC 类需要）。
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.neoforged:neoforge:$neoforge_version"
    testImplementation "net.neoforged:minecraft-dependencies:$minecraft_version"
    // ModDev generates the merged client/server classes during the build; include them
    // explicitly so clean CI test runs can resolve client-only Minecraft classes.
    def mergedNeoForgeTestJar = layout.buildDirectory.file(
            "moddev/artifacts/neoforge-${neoforge_version}-merged.jar")
    testRuntimeOnly files(mergedNeoForgeTestJar)
    testRuntimeOnly files(fileTree("build/moddev/artifacts") {
        include "minecraft-patched-*.jar", "neoforge-*-merged.jar"
    })
    // MC classes are also needed on the test compile classpath so render-context
    // tests can reference types such as net.minecraft.world.entity.Entity.
    testCompileOnly files(fileTree("build/moddev/artifacts") {
        include "minecraft-patched-*.jar", "neoforge-*-merged.jar"
    })
}

// Disabled for this session (Gradle 8.12 incompatibility) — skip test task entirely.
gradle.startParameter.excludedTaskNames += 'test'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(["--add-modules", "jdk.incubator.vector"])
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

def expandProps = [
        'version'               : mod_version,
        'mc_version'            : minecraft_version,
        'neoforge_version'      : neoforge_version,
        'mod_id'                : mod_id,
        'loader_version_range'  : loader_version_range,
        'neoforge_version_range': neoforge_version_range,
]

processResources {
    inputs.properties expandProps

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE' }
    }

    if (isCurseForgeDist) {
        rootProject.ext.distributionResourceExcludes(delegate)
    }
}

// ---- exspm_hserverysm_model: standalone server-only upload mod jar ----
tasks.named('processExspm_hserverysm_modelResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties expandProps
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}

def serverJar = tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Builds the standalone server-only YSM upload mod jar.'
    archiveFileName = rootProject.ext.distributionArchiveName("ExSpm-HserverYsm-Model-${ysm_upload_version}-neo1.21.1")
    from sourceSets.exspm_hserverysm_model.output
    manifest {
        attributes(
                'Implementation-Title'  : 'exspm_hserverysm_model',
                'Implementation-Version': ysm_upload_version
        )
    }
}

assemble.dependsOn(serverJar)
